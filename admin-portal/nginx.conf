server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: any path that isn't a real file falls back to index.html so
    # React Router can handle it (e.g. a hard refresh on /classes).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
